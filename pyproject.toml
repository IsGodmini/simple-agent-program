[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-agent-program"
version = "0.1.0"
description = "A minimal tool-using software development agent"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
simple-agent = "simple_agent.cli:main"
simple-agent-web = "simple_agent.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simple_agent = ["web/*.html", "web/*.css", "web/*.js"]
